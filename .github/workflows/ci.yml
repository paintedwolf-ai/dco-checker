name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install verification dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Verify certification contracts
        env:
          PYTHONPATH: scripts
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate GitHub workflows
        # GitHub supports queue; actionlint 1.7.12 does not. Parsed contracts
        # validate every concurrency section before this single tool exception.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color -ignore 'unexpected key "queue" for "concurrency" section'
  check:
    if: ${{ !cancelled() }}
    needs: [test, workflow]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = [name for name, result in results.items() if result['result'] != 'success']
          if failed:
              print('Verification did not pass: ' + ', '.join(failed))
              sys.exit(1)
          PY
