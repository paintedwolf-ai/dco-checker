name: DCO
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Ready pull request number
        required: true
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
concurrency:
  group: dco-certification
  queue: max
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Certify original PR commits
        uses: paintedwolf-ai/dco-checker@ACTION_SHA
