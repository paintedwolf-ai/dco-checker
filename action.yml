name: Original commit certification
description: Certify original pull request commits and merge queue members under the DCO.
inputs:
  token:
    description: Caller GitHub Actions GITHUB_TOKEN with contents, pull requests, and Actions read, and checks/statuses write permissions; other publishers are unsupported.
    required: false
    default: ${{ github.token }}
  ci-workflow:
    description: Caller CI workflow filename used to verify workflow_run events.
    required: false
    default: ci.yml
runs:
  using: composite
  steps:
    - name: Certify original PR commits
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DCO_CI_WORKFLOW: ${{ inputs.ci-workflow }}
        DCO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        DCO_RUN_ID: ${{ github.run_id }}
        DCO_RUN_ATTEMPT: ${{ github.run_attempt }}
        DCO_CALLER_REVISION: ${{ github.workflow_sha }}
        DCO_CHECKER_REVISION: ${{ github.action_ref }}
        DCO_ACTION_PATH: ${{ github.action_path }}
      run: |
        if [[ -z "$DCO_CHECKER_REVISION" ]]; then
          DCO_CHECKER_REVISION="$(git -C "$DCO_ACTION_PATH" rev-parse HEAD)"
          export DCO_CHECKER_REVISION
        fi
        python3 "$DCO_ACTION_PATH/scripts/dco_check.py"
